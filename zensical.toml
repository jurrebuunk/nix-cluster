# The cluster docs (Zensical), one of the three hgd1 doc sites:
# Kubernetes (hgd1-k8s), network (hgd1-network) and this one.
# Preview: nix develop, then zensical serve.
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.
[project]
site_name = "hgd1 Cluster"
site_description = "NixOS, Ceph, the S3 endpoint, microVMs and k3s on three small nodes"
site_author = "Jurre Buunk"
site_url = "https://jurrebuunk.github.io/nix-hgd1-cluster/"
repo_url = "https://github.com/jurrebuunk/nix-hgd1-cluster"
repo_name = "jurrebuunk/nix-hgd1-cluster"
edit_uri = "edit/main/docs/"
copyright = "Jurre Buunk"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "get-started/index.md",
    "get-started/access.md",
    "get-started/first-change.md",
    "get-started/repository.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/network.md",
    "concepts/remote-access.md",
    "concepts/hosts.md",
    "concepts/ceph.md",
    "concepts/s3.md",
    "concepts/vms.md",
    "concepts/k3s.md",
    "concepts/monitoring.md",
    "concepts/api.md",
  ] },
  { "How-to" = [
    "how-to/index.md",
    { "Changes" = [
      "how-to/deploy.md",
      "how-to/roll-back.md",
      "how-to/update-dependencies.md",
      "how-to/manage-secrets.md",
    ] },
    { "VMs and k3s" = [
      "how-to/manage-vms.md",
      "how-to/restart-k3s-nodes.md",
    ] },
    { "Building on top" = [
      "how-to/use-the-cli.md",
      "how-to/create-s3-user.md",
    ] },
  ] },
  { "Operate" = [
    "operate/index.md",
    "operate/host-maintenance.md",
    "operate/disk-replacement.md",
    "operate/troubleshooting.md",
    "operate/disaster-recovery.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/addresses.md",
    "reference/firewall.md",
    "reference/inventory.md",
    "reference/repositories.md",
    "reference/files.md",
    "reference/credentials.md",
    "reference/api.md",
    "reference/cli.md",
    "reference/scripts.md",
    "reference/glossary.md",
    "reference/roadmap.md",
  ] },
  # The other two doc sites, in their own colour.
  { "Kubernetes docs ↗" = "https://jurrebuunk.github.io/hgd1-k8s/" },
  { "Network docs ↗" = "https://jurrebuunk.github.io/hgd1-network/" },
]

# flatwork.css is the same on all three sites; site.css sets this site's colour.
# Bump ?v= when a stylesheet changes, so browsers drop their cached copy.
extra_css = ["stylesheets/flatwork.css?v=8", "stylesheets/site.css?v=1"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"
repo = "fontawesome/brands/github"

# One dark scheme; background and colours come from the stylesheets.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jurrebuunk/nix-hgd1-cluster"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Glossary terms (includes/abbreviations.md) get a hover tooltip on every page.
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
