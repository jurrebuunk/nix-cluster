# Documentation site (Zensical). Preview: nix develop, then zensical serve.
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.
[project]
site_name = "hgd1 homelab"
site_description = "NixOS, Ceph and k3s on three small nodes, with the site network around them"
site_author = "Jurre Buunk"
site_url = "https://jurrebuunk.github.io/nix-hgd1-cluster/"
repo_url = "https://github.com/jurrebuunk/nix-hgd1-cluster"
repo_name = "jurrebuunk/nix-hgd1-cluster"
edit_uri = "edit/main/docs/"
copyright = "Jurre Buunk"

nav = [
  { "Home" = "index.md" },
  { "Understand the project" = [
    "understand/architecture.md",
    "understand/repository.md",
    "understand/roadmap.md",
  ] },
  { "Network" = [
    "network/index.md",
    "network/remote-access.md",
    "network/bootstrap.md",
  ] },
  { "Hosts" = [
    "hosts/index.md",
    "hosts/deploy.md",
  ] },
  { "Storage" = [
    "storage/ceph.md",
    "storage/s3.md",
  ] },
  { "Compute" = [
    "compute/vms.md",
    "compute/k3s.md",
  ] },
  { "Build on top" = [
    "build/index.md",
  ] },
  { "Operations" = [
    "operations/index.md",
    "operations/maintenance.md",
    "operations/secrets.md",
    "operations/recovery.md",
  ] },
  { "Reference" = [
    "reference/addresses.md",
    "reference/scripts.md",
  ] },
]

extra_css = ["stylesheets/flatwork.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"
repo = "fontawesome/brands/github"

# One dark scheme; background and primary colour come from stylesheets/flatwork.css.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jurrebuunk/nix-hgd1-cluster"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
