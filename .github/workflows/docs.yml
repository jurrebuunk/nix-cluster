# Build the documentation (docs/, zensical.toml) and publish it to GitHub Pages.
name: Documentation
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - includes/**
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy as separate jobs (GitHub's own pattern): the deploy job
  # starts once the artifact is fully uploaded, so it always finds exactly one.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.62
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
